name: Publicar

# Al subir una etiqueta vX.Y.Z se compila para cada sistema y se crea la versión.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev patchelf desktop-file-utils file
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: AppImage
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool
          APPDIR=$PWD/Cerrojo.AppDir
          install -Dm755 target/release/cerrojo "$APPDIR/usr/bin/cerrojo"
          packaging/bundle-libs.sh "$APPDIR"
          install -Dm755 packaging/AppRun "$APPDIR/AppRun"
          install -Dm644 LICENSE "$APPDIR/usr/share/doc/cerrojo/LICENSE"
          install -Dm644 packaging/cerrojo.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/dev.cerrojo.svg"
          install -Dm644 packaging/cerrojo-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/dev.cerrojo.png"
          cp packaging/cerrojo.svg "$APPDIR/dev.cerrojo.svg"
          ln -s dev.cerrojo.svg "$APPDIR/.DirIcon"
          sed "\$a X-AppImage-Version=$VERSION" packaging/cerrojo.desktop > "$APPDIR/dev.cerrojo.desktop"
          desktop-file-validate "$APPDIR/dev.cerrojo.desktop"
          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=${{ matrix.arch }} ./appimagetool --no-appstream "$APPDIR" dist/Cerrojo-${{ matrix.arch }}.AppImage
      - name: Prueba rápida (sin ventana)
        run: dist/Cerrojo-${{ matrix.arch }}.AppImage --appimage-extract-and-run apk com.ejemplo.prueba /tmp/p.apk && test -s /tmp/p.apk
      - uses: actions/upload-artifact@v4
        with: { name: linux-${{ matrix.arch }}, path: dist/* }

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            zip
      - run: cargo build --release --locked
      - name: Carpeta portátil
        run: |
          D=Cerrojo
          mkdir -p $D/share/glib-2.0/schemas $D/lib
          cp target/release/cerrojo.exe $D/Cerrojo.exe
          ldd $D/Cerrojo.exe | grep -i '/ucrt64/' | awk '{print $3}' | sort -u | xargs -I{} cp {} $D/
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled $D/share/glib-2.0/schemas/
          cp -r /ucrt64/lib/gdk-pixbuf-2.0 $D/lib/
          for f in $D/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll; do
            ldd "$f" | grep -i '/ucrt64/' | awk '{print $3}' | xargs -I{} cp -n {} $D/ || true
          done
          cp LICENSE $D/LICENSE.txt
          printf 'Cerrojo\r\n\r\nAbre Cerrojo.exe.\r\nNecesitas adb: en PowerShell, winget install Google.PlatformTools\r\nGuia completa: https://github.com/sthifen/cerrojo\r\n' > $D/LEEME.txt
          ./$D/Cerrojo.exe apk com.ejemplo.prueba p.apk && test -s p.apk
          mkdir -p dist && zip -qr dist/Cerrojo-windows-x86_64.zip $D
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install gtk4 dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Cerrojo.app
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP=Cerrojo.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources $APP/Contents/Frameworks
          cp target/release/cerrojo $APP/Contents/MacOS/cerrojo
          sed "s/@VERSION@/$VERSION/" packaging/Info.plist > $APP/Contents/Info.plist
          mkdir cerrojo.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/cerrojo-512.png --out cerrojo.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2)); sips -z $d $d packaging/cerrojo-512.png --out cerrojo.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns cerrojo.iconset -o $APP/Contents/Resources/cerrojo.icns
          dylibbundler -od -b -x $APP/Contents/MacOS/cerrojo -d $APP/Contents/Frameworks -p @executable_path/../Frameworks/
          codesign --force --deep -s - $APP
          $APP/Contents/MacOS/cerrojo apk com.ejemplo.prueba /tmp/p.apk && test -s /tmp/p.apk
          mkdir -p dist && ditto -c -k --keepParent $APP dist/Cerrojo-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  release:
    needs: [linux, windows, macos]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && ls -l
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Cerrojo $TAG" --notes-file packaging/notas.md
          gh release upload "$TAG" dist/* --clobber
